---
site: north
site_label: North
required_tests:
- production.bias_curves.grid
- production.bias_curves.submit
- production.bias_curves.collect
- derive.bias_curves
- compare.bias_curves
- compare.atmospheres
- production.gamma.collect
- derive.trigger_histograms
- compare.trigger_histograms
- compare.compute_resources
- flasher_response.scan
array_layout_name: CTAO-North-Alpha
camera_telescopes: [LSTN-01, LSTN-02, MSTN-01]
telescope_configuration_overrides:
  production.bias_curves.grid:
    LSTN-01:
      proton_showers_per_run: 10000
      proton_number_of_runs: 20
      nsb_showers_per_run: 5000
      nsb_number_of_runs: 25
      trigger_thresholds: [220, 15, 10]
      core_scatter: 10 1900 m
      proton_energy_range: 3 GeV 20 TeV
    LSTN-02:
      proton_showers_per_run: 10000
      proton_number_of_runs: 20
      nsb_showers_per_run: 5000
      nsb_number_of_runs: 25
      trigger_thresholds: [220, 15, 10]
      core_scatter: 10 1900 m
      proton_energy_range: 3 GeV 20 TeV
    MSTN-01:
      proton_showers_per_run: 10000
      proton_number_of_runs: 20
      nsb_showers_per_run: 5000
      nsb_number_of_runs: 25
      trigger_thresholds: [22, 10, 2]
      core_scatter: 10 1900 m
      proton_energy_range: 20 GeV 20 TeV
