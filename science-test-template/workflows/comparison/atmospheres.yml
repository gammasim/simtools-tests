---
applications:
- application: simtools-get-model-parameter
  configuration:
    parameter: atmospheric_profile
    parameter_version: __ATMOSPHERE_REFERENCE_PROFILE_VERSION__
    site: __SCIENCE_SITE__
    export_model_file: true
    export_model_file_as_table: true
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/reference
- application: simtools-get-model-parameter
  configuration:
    parameter: atmospheric_transmission
    parameter_version: __ATMOSPHERE_REFERENCE_TRANSMISSION_VERSION__
    site: __SCIENCE_SITE__
    export_model_file: true
    export_model_file_as_table: true
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/reference
- application: simtools-get-model-parameter
  configuration:
    parameter: atmospheric_profile
    parameter_version: __ATMOSPHERE_CANDIDATE_PROFILE_VERSION__
    site: __SCIENCE_SITE__
    export_model_file: true
    export_model_file_as_table: true
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/candidate
- application: simtools-get-model-parameter
  configuration:
    parameter: atmospheric_transmission
    parameter_version: __ATMOSPHERE_CANDIDATE_TRANSMISSION_VERSION__
    site: __SCIENCE_SITE__
    export_model_file: true
    export_model_file_as_table: true
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/candidate
- application: simtools-compare-atmospheres
  configuration:
    atmosphere:
    - [
      __SCIENCE_SITE__,
      __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/reference/atmospheric_profile-__ATMOSPHERE_REFERENCE_PROFILE_VERSION__-OBS-__SCIENCE_SITE__.ecsv,
      __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/reference/atmospheric_transmission-__ATMOSPHERE_REFERENCE_TRANSMISSION_VERSION__-OBS-__SCIENCE_SITE__.ecsv,
    ]
    - [
      __SCIENCE_SITE__,
      __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/candidate/atmospheric_profile-__ATMOSPHERE_CANDIDATE_PROFILE_VERSION__-OBS-__SCIENCE_SITE__.ecsv,
      __SCIENCE_CANDIDATE_SITE_PATH__/atmosphere-comparison/candidate/atmospheric_transmission-__ATMOSPHERE_CANDIDATE_TRANSMISSION_VERSION__-OBS-__SCIENCE_SITE__.ecsv,
    ]
    figure_format: [pdf]
    output_path: __SCIENCE_REPORT_PATH__
schema_name: application_workflow.metaschema
schema_version: 0.7.0
