---
applications:
- application: simtools-simulate-flasher
  configuration:
    run_mode: full_simulation
    light_source_type: flat_fielding
    telescopes:
    - __SCIENCE_CAMERA_TELESCOPE__
    model_version: __SCIENCE_MODEL_VERSION__
    site: __SCIENCE_SITE__
    run_number: 100
    number_of_events: 50
    simulation_software:
    - light_emission
    - sim_telarray
    max_photoelectrons: 40000000
    flasher_photons:
    - 30000
    - 100000
    - 300000
    - 1000000
    - 3000000
    label: flasher_response
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__/flasher_response/__SCIENCE_CAMERA_TELESCOPE__/scan/simulation
    sim_telarray_seed:
    - 101
    - 102
    max_workers: 4
- application: simtools-analyze-flasher-response
  configuration:
    simtel_files:
    - __SCIENCE_CANDIDATE_SITE_PATH__/flasher_response/__SCIENCE_CAMERA_TELESCOPE__/scan/simulation/run__FLASHER_RUN__/sim_telarray/full_simulation_run__FLASHER_RUN_____SCIENCE_SITE_____SCIENCE_MODEL_VERSION___flasher_response___SCIENCE_CAMERA_TELESCOPE__.simtel.zst
    telescope: __SCIENCE_CAMERA_TELESCOPE__
    pixels:
    - 0
    output_path: __SCIENCE_REPORT_PATH__/__SCIENCE_CAMERA_TELESCOPE__
- application: simtools-plot-simtel-events
  configuration:
    telescope: __SCIENCE_CAMERA_TELESCOPE__
    max_events: 50
    average_events: true
    output_path: __SCIENCE_REPORT_PATH__/__SCIENCE_CAMERA_TELESCOPE__/events/__FLASHER_PHOTONS__/high
schema_name: application_workflow.metaschema
schema_version: 0.7.0
