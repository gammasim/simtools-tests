---
applications:
- application: simtools-compare-science-results
  configuration:
    baseline_path: __SCIENCE_BASELINE_SITE_PATH__/camera_efficiency
    candidate_path: __SCIENCE_CANDIDATE_SITE_PATH__/camera_efficiency
    baseline_label: v0.37.0
    candidate_label: __SCIENCE_RELEASE_LABEL__
    output_path: __SCIENCE_REPORT_PATH__
    require_wavelength_tables: true
    tolerance:
    - reflectivity=0.05
    - cam_eff=0.05
    - tel_eff=0.05
    - tot_sens=0.05
    - nsb_rate=0.05
    - nsb_ref=0.05
    - muon_frac=0.05
schema_name: application_workflow.metaschema
schema_version: 0.7.0
