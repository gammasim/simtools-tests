---
applications:
- application: simtools-simulate-prod
  configuration:
    job_grid_file: __SCIENCE_CANDIDATE_PATH__/__SCIENCE_SITE_KEY___job_grid.ecsv
    label: __SCIENCE_RELEASE_LABEL__
    log_level: DEBUG
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__
    backend: htcondor
    wait: false
    # Inline settings are resolved with the workflow's science-test replacement map.
    backend_config:
      request_cpus: 1
      request_memory: 16GB
      request_disk: 10GB
      container_image: __SCIENCE_CONTAINER_IMAGE_PATH__
      environment_file: __CONFIG_DIRECTORY__/../../profiles/htcondor.env
      poll_interval: 60
      priority: 10
      timeout: 86400
      cancel_on_interrupt: false
      keep_successful_artifacts: true
      extra_submit_attributes: {}
schema_name: application_workflow.metaschema
schema_version: 0.7.0
