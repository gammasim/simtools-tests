    corsika_interaction_table_path: __CORSIKA_INTERACTION_TABLE_PATH__
    backend: htcondor
    wait: false
    backend_config: __CONFIG_DIRECTORY__/../../profiles/htcondor.yml
- application: simtools-simulate-prod
  configuration:
    job_grid_file: __SCIENCE_CANDIDATE_SITE_PATH__/bias_curves/__SCIENCE_CAMERA_TELESCOPE__/scan_grids/proton/scan_grid.ecsv
