    job_grid_file: __SCIENCE_CANDIDATE_SITE_PATH__/bias_curves/__SCIENCE_CAMERA_TELESCOPE__/scan_grids/nsb/scan_grid.ecsv
    label: __SCIENCE_RELEASE_LABEL__-__SCIENCE_CAMERA_TELESCOPE__-bias-nsb
    log_level: INFO
    output_path: __SCIENCE_CANDIDATE_SITE_PATH__/bias_curves/__SCIENCE_CAMERA_TELESCOPE__/jobs/nsb
