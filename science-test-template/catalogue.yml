---
tests:
  production.gamma.grid:
    affects_production: true
    workflow: workflows/production/gamma_job_grid.yml
    sites: [north, south]
    tier: release-light
    depends_on: []
  production.bias_curves.grid:
    affects_production: true
    workflow: workflows/production/bias_curves_grid.yml
    sites: [north, south]
    tier: release-light
    depends_on: []
  production.bias_curves.submit:
    workflow: workflows/production/bias_curves_submit.yml
    sites: [north, south]
    tier: release-prod
    depends_on: [production.bias_curves.grid]
    requires:
    - __SCIENCE_CANDIDATE_SITE_PATH__/bias_curves/*/scan_grids/nsb/scan_grid.ecsv
    - __SCIENCE_CANDIDATE_SITE_PATH__/bias_curves/*/scan_grids/proton/scan_grid.ecsv
    produces_production: true
  production.bias_curves.collect:
    workflow: workflows/production/bias_curves_collect.yml
    sites: [north, south]
    tier: release-light
    depends_on: []
    collect_production: true
    requires:
    - __SCIENCE_CANDIDATE_SITE_PATH__/bias_curves/*/jobs/**/submission.json
  derive.bias_curves:
    workflow: workflows/derivation/bias_curves.yml
    sites: [north, south]
    tier: release-light
    runtime_role: camera
    depends_on: [production.bias_curves.collect]
    requires_completed_production: true
    derived_output: __SCIENCE_CANDIDATE_SITE_PATH__/derived/bias_curves
  compare.bias_curves:
    acceptance_rule: bias-curves-provisional
    workflow: workflows/comparison/bias_curves.yml
    sites: [north, south]
    tier: release-light
    runtime_role: analysis
    depends_on: [derive.bias_curves]
    requires:
    - __SCIENCE_CANDIDATE_SITE_PATH__/derived/bias_curves/*/bias_curve.ecsv
    - __SCIENCE_BASELINE_SITE_PATH__/derived/bias_curves/*/bias_curve.ecsv
    result_status_file: __SCIENCE_REPORT_PATH__/science-comparison.json
  production.gamma:
    workflow: workflows/production/gamma_submit.yml
    sites: [north, south]
    tier: release-prod
    # Explicit selection and --allow_production are required after grid review.
    depends_on: []
    requires:
    - __SCIENCE_CANDIDATE_PATH__/__SCIENCE_SITE_KEY___job_grid.ecsv
    produces_production: true
  production.gamma.collect:
    workflow: workflows/production/gamma_collect.yml
    sites: [north, south]
    tier: release-light
    depends_on: []
    collect_production: true
    reviewed_grid: __SCIENCE_CANDIDATE_PATH__/__SCIENCE_SITE_KEY___job_grid.ecsv
    requires:
    - __SCIENCE_CANDIDATE_SITE_PATH__/**/submission.json
  derive.trigger_histograms:
    workflow: workflows/derivation/trigger_histograms.yml
    sites: [north, south]
    tier: release-light
    depends_on: [production.gamma.collect]
    requires_completed_production: true
    reviewed_grid: __SCIENCE_CANDIDATE_PATH__/__SCIENCE_SITE_KEY___job_grid.ecsv
    derived_output: __SCIENCE_CANDIDATE_SITE_PATH__/derived/trigger_histograms
  compare.trigger_histograms:
    workflow: workflows/comparison/trigger_histograms.yml
    sites: [north, south]
    tier: release-light
    depends_on: [derive.trigger_histograms]
    requires:
    - __SCIENCE_CANDIDATE_SITE_PATH__/derived/trigger_histograms/**/*.hdf5
    - __SCIENCE_BASELINE_SITE_PATH__/derived/trigger_histograms/**/*.hdf5
    acceptance_rule: gamma-events
    reviewed_grid: __SCIENCE_CANDIDATE_PATH__/__SCIENCE_SITE_KEY___job_grid.ecsv
  compare.compute_resources:
    workflow: workflows/comparison/compute_resources.yml
    sites: [north, south]
    tier: release-light
    depends_on: [production.gamma.collect]
    requires_completed_production: true
    reviewed_grid: __SCIENCE_CANDIDATE_PATH__/__SCIENCE_SITE_KEY___job_grid.ecsv
    acceptance_rule: computing

  compare.atmospheres:
    workflow: workflows/comparison/atmospheres.yml
    sites: [north, south]
    tier: release-light
    depends_on: []
    runtime_role: camera
    acceptance_rule: atmosphere-common-wavelengths
  telescope_throughput:
    publish_report: false
    workflow: workflows/telescope_throughput/run.yml
    sites: [north, south]
    tier: release-light
    runtime_role: camera
    depends_on: []
  compare.telescope_throughput:
    workflow: workflows/telescope_throughput/compare.yml
    sites: [north, south]
    tier: release-light
    runtime_role: analysis
    depends_on: [telescope_throughput]
    result_status_file: __SCIENCE_REPORT_PATH__/science-comparison.json
