---
exclude: ^simtools-tests/legacy/

repos:
# Ruff
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.3
  hooks:
  - id: ruff
    args: ["--fix"]
  - id: ruff-format
# pylint
- repo: local
  hooks:
  - id: pylint
    name: pylint
    entry: pylint
    language: system
    types: [python]
    args:
      [
        "-rn",  # Only display messages
        "-sn",  # Don't display the score
      ]
# https://github.com/pre-commit/pre-commit-hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-added-large-files
    args: ['--maxkb=15000']
  - id: check-json
  - id: check-toml
  - id: no-commit-to-branch
    args: [--branch=main]
# GitHub Actions
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
# https://pyproject-fmt.readthedocs.io/en/latest/
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: "v2.28.0"
  hooks:
  - id: pyproject-fmt
# codespell
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    args: [
      "--skip=tests/resources/example_non_utf-8_file.lis",
      "--ignore-words-list=als,ARRANG,hel",
    ]
# yamllint
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    args:
      [
        "--strict",
        "-d",
        '{extends: default, rules: {line-length: {max: 300}, indentation: {spaces: 2, indent-sequences: consistent}, truthy: {allowed-values: ["true", "false", "on", "off"]}}}'
      ]
# shellcheck
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
