  configuration:
    export_model_file: true
    model_version: 7.0.0
    output_file: nsb_reference_spectrum-1.0.0-OBS-North.ecsv
    output_path: __TEST_DIRECTORY__/simtools-tests/__SIMTOOLS_VERSION__/integration_tests/tmp_application_output
    parameter: nsb_reference_spectrum
    parameter_version: 1.0.0
    site: North
- application: simtools-validate-camera-efficiency
  configuration:
    model_version: 7.0.0
    nsb_spectrum: __TEST_DIRECTORY__/simtools-tests/__SIMTOOLS_VERSION__/integration_tests/tmp_application_output/nsb_reference_spectrum-1.0.0-OBS-North.ecsv
    output_path: __TEST_DIRECTORY__/simtools-tests/__SIMTOOLS_VERSION__/integration_tests/tmp_application_output
    site: North
    telescope: MSTx-NectarCam
    parameter_version: 0.0.99
    write_reference_nsb_rate_as_parameter: true
    zenith_angle: 0.0
collection:
  output_path: __TEST_DIRECTORY__/simtools-tests/__SIMTOOLS_VERSION__/integration_tests/generated/camera_efficiency
  files:
  - camera_efficiency_summary_North_MSTx-NectarCam_za0.0deg_azm000deg.yml
schema_name: application_workflow.metaschema
